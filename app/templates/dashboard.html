<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumivo | Başvuru Paneli</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #fbf7ef;
    }
    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }
    h1 { margin: 0; font-size: 34px; letter-spacing: 0; }
    a { color: #164e73; font-weight: 800; text-decoration: none; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 13px 14px;
      border-bottom: 1px solid #e8edf4;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #1f6f9f;
      color: white;
    }
    tr:last-child td { border-bottom: 0; }
    .empty {
      padding: 18px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: white;
      color: #5b667a;
    }
    @media (max-width: 820px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr { border-bottom: 1px solid #d8dee8; }
      td::before {
        content: attr(data-label);
        display: block;
        font-weight: 800;
        margin-bottom: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Lumivo Başvuru Paneli</h1>
      <a href="/">Siteye Dön</a>
    </header>
    <div id="content" class="empty">Başvurular yükleniyor...</div>
  </div>

  <script>
    async function loadLeads() {
      const content = document.querySelector("#content");
      const response = await fetch("/api/leads");
      const data = await response.json();

      if (!data.basari || data.leads.length === 0) {
        content.className = "empty";
        content.textContent = "Henüz başvuru kaydı yok.";
        return;
      }

      content.className = "";
      content.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>İsim</th>
              <th>Telefon</th>
              <th>E-posta</th>
              <th>İhtiyaç</th>
              <th>Teslim</th>
              <th>Tarih</th>
            </tr>
          </thead>
          <tbody>
            ${data.leads.map((lead) => `
              <tr>
                <td data-label="İsim">${lead.isim}</td>
                <td data-label="Telefon">${lead.telefon}</td>
                <td data-label="E-posta">${lead.email || "-"}</td>
                <td data-label="İhtiyaç">${lead.ihtiyac || "-"}</td>
                <td data-label="Teslim">${lead.teslim_tarihi || "-"}</td>
                <td data-label="Tarih">${lead.tarih}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    loadLeads();
  </script>
</body>
</html>
